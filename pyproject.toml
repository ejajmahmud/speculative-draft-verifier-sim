[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-draft-verifier-sim"
version = "0.1.0"
description = "Simulates and profiles draft-vs-target speculative decoding acceptance rates, gamma horizons, and effective speedup"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
speculative-draft-verifier-sim = "speculative_draft_verifier_sim.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["speculative_draft_verifier_sim*"]
